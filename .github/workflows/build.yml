name: Criar EXE Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Instalar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Instalar Dependências e Compilar Site
      run: |
        npm install
        npm run build:web

    - name: Construir o Executável (EXE)
      run: npm run dist -- --win

    - name: Upload do Arquivo (Salvar para baixar)
      uses: actions/upload-artifact@v3
      with:
        name: Blocky-Setup-Windows
        path: release-builds/*.exe
